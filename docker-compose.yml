# Local stack: API (+ MCP at /mcp) backed by a persistent Qdrant.
#   docker compose up --build
#   open http://localhost:8080/docs
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant_storage:/qdrant/storage"]

  api:
    build: .
    env_file: [{ path: .env, required: false }]
    environment:
      PMRA_VECTOR_STORE: qdrant
      PMRA_QDRANT_URL: http://qdrant:6333
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on: [qdrant]

  # Standalone MCP server over streamable HTTP (http://localhost:8765/mcp)
  mcp:
    build: .
    command: ["pmra", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]
    env_file: [{ path: .env, required: false }]
    environment:
      PMRA_VECTOR_STORE: qdrant
      PMRA_QDRANT_URL: http://qdrant:6333
    ports: ["8765:8765"]
    depends_on: [qdrant]

volumes:
  qdrant_storage:
