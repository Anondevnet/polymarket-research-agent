name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,all]"
      - name: Lint & type-check
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy
      - name: Unit tests (offline, mocked network)
        run: pytest

  offline-eval:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Retrieval eval (fails the build if hybrid recall@5 regresses)
        run: pmra eval retrieval --out reports --min-hybrid-recall5 0.8
      - name: Forecast eval (offline replay of committed snapshot)
        env:
          PMRA_LLM_PROVIDER: heuristic
          PMRA_VECTOR_STORE: memory
        run: |
          pmra eval forecast --snapshot data/eval/forecast_snapshot.json --out reports
          cat reports/forecast_eval.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports/
