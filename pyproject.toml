[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pm-research-agent"
version = "0.1.0"
description = "Read-only prediction-market research agent: RAG over news, LangGraph reasoning, MCP tools, and forecast evals against resolved Polymarket markets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anondevnet" }]
keywords = ["rag", "langgraph", "mcp", "polymarket", "forecasting", "evals", "qdrant"]
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "qdrant-client>=1.10",
  "langgraph>=0.2",
  "mcp>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
local = ["sentence-transformers>=2.7"]
tracing = ["langfuse>=3.0", "opentelemetry-exporter-otlp-proto-http>=1.24"]
screenshots = ["playwright>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]
all = ["pm-research-agent[openai,tracing]"]

[project.scripts]
pmra = "pm_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = ["live: hits real network APIs (deselected by default in CI)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["pm_research"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
